# 接入已有整栈的叠加片段：本项目服务及共享代理检测策略，复用已有代理与网络。
# 在部署根执行：
# docker compose -f docker-compose.yml -f cpa2sub2api/docker-compose.cpa2sub2api.yml up -d cpa2sub2api
# VPS 已有父 compose 内的本服务时无需上传或叠加本模板。
services:
  # 保留父栈upstream-importer的init/kernel镜像；只补检测策略环境。
  mihomo-init:
    environment:
      MIHOMO_AUTOMATIC_TESTS: ${MIHOMO_AUTOMATIC_TESTS:-false}

  mihomo-policy-init:
    image: ${DOCKERHUB_USERNAME:?请设置 DOCKERHUB_USERNAME}/${DOCKERHUB_IMAGE:-cpa2sub2api}:${CPA2SUB2API_IMAGE_TAG:-latest}
    pull_policy: always
    user: '0:0'
    entrypoint: [/bin/sh, /app/mihomo-manager/bootstrap-mihomo.sh]
    environment:
      MIHOMO_POLICY_ONLY: '1'
      MIHOMO_AUTOMATIC_TESTS: ${MIHOMO_AUTOMATIC_TESTS:-false}
      MIHOMO_TARGET_DIR: /mihomo-config
    volumes: ['${MIHOMO_SHARED_VOLUME:-mihomo-data}:/mihomo-config']
    network_mode: none
    depends_on:
      mihomo-init: {condition: service_completed_successfully}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  mihomo:
    environment:
      MIHOMO_AUTOMATIC_TESTS: ${MIHOMO_AUTOMATIC_TESTS:-false}
    depends_on:
      mihomo-policy-init: {condition: service_completed_successfully}

  cpa2sub2api:
    image: ${DOCKERHUB_USERNAME:?请设置 DOCKERHUB_USERNAME}/${DOCKERHUB_IMAGE:-cpa2sub2api}:${CPA2SUB2API_IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    env_file: [.env]
    environment:
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-http://sub2api:8080}
      SUB2API_ADMIN_KEY: ${SUB2API_ADMIN_KEY:?请填写 sub2api 管理密钥}
      CPA_BASE_URL: ${CPA_BASE_URL:-http://cli-proxy-api:8317}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:-}
      FALLBACK_PROXY: ${FALLBACK_PROXY:-http://mihomo:7890}
      SETTINGS_PATH: /app/state/设置.json
      MODEL_PROBE_ENABLED: ${MODEL_PROBE_ENABLED:-false}
      MODEL_PROBE_HARD_DISABLED: ${MODEL_PROBE_HARD_DISABLED:-false}
      ONLINE_PROBE_HOSTS: ${ONLINE_PROBE_HOSTS:-}
      AUTO_RECOVER_CRON: ${AUTO_RECOVER_CRON:-0 3 * * 0}
      RUN_INTERVAL_SECONDS: ${RUN_INTERVAL_SECONDS:-0}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config.yaml:/app/config.yaml:ro,z
      - cpa2sub2api-out:/app/out
      - cpa2sub2api-state:/app/state
    networks: [sub2api-network, default]
    depends_on:
      sub2api: {condition: service_started}
      mihomo: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import tool, yaml, model_probe, probe_policy"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  # Optional local authorization panel; the default CLI remains unchanged.
  probe-ui:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_IMAGE:-cpa2sub2api}:${CPA2SUB2API_IMAGE_TAG:-latest}
    profiles: [probe-ui]
    pull_policy: always
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    entrypoint: [python, /app/probe_web.py]
    command: [serve, --bind, 0.0.0.0, --port, '8775']
    environment:
      PROBE_UI_TOKEN: ${PROBE_UI_TOKEN:-}
      PROBE_UI_ORIGIN: ${PROBE_UI_ORIGIN:-http://127.0.0.1:8775}
      REQUEST_RELAY_ENABLED: ${REQUEST_RELAY_ENABLED:-false}
      REQUEST_RELAY_FORCE_ALL_ACCOUNTS: ${REQUEST_RELAY_FORCE_ALL_ACCOUNTS:-false}
      REQUEST_RELAY_BASE_URL: ${REQUEST_RELAY_BASE_URL:-http://request-relay:8380}
      REQUEST_RELAY_STATE_DIR: /app/state/relay
      REQUEST_RELAY_SOURCE_SCOPE: ${REQUEST_RELAY_SOURCE_SCOPE:-default}
      REQUEST_RELAY_WEIGHTED_BUCKET: ${REQUEST_RELAY_WEIGHTED_BUCKET:-false}
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-http://sub2api:8080}
      SUB2API_ADMIN_KEY: ${SUB2API_ADMIN_KEY:-}
      SETTINGS_PATH: /app/state/设置.json
      MODEL_PROBE_ENABLED: ${MODEL_PROBE_ENABLED:-false}
      MODEL_PROBE_HARD_DISABLED: ${MODEL_PROBE_HARD_DISABLED:-false}
      ONLINE_PROBE_HOSTS: ${ONLINE_PROBE_HOSTS:-}
      AUTO_RECOVER_CRON: ${AUTO_RECOVER_CRON:-0 3 * * 0}
      LOG_LEVEL: INFO
      LOG_TO_FILE: 'false'
      TZ: ${TZ:-Asia/Shanghai}
    ports: ['127.0.0.1:${PROBE_UI_PORT:-8775}:8775']
    volumes:
      - ./config.yaml:/app/config.yaml:ro,z
      - cpa2sub2api-state:/app/state
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [sub2api-network, default]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request,urllib.parse; origin=os.environ.get('PROBE_UI_ORIGIN') or 'http://127.0.0.1:8775'; req=urllib.request.Request('http://127.0.0.1:8775/', headers={'Host':urllib.parse.urlsplit(origin).netloc}); assert urllib.request.urlopen(req, timeout=3).status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  # Private inference front; no host port and no startup model request.
  request-relay:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_IMAGE:-cpa2sub2api}:${CPA2SUB2API_IMAGE_TAG:-latest}
    profiles: [request-relay]
    pull_policy: always
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    entrypoint: [python, /app/request_relay.py]
    command: [serve]
    environment:
      MODEL_PROBE_ENABLED: ${MODEL_PROBE_ENABLED:-false}
      MODEL_PROBE_HARD_DISABLED: ${MODEL_PROBE_HARD_DISABLED:-false}
      ONLINE_PROBE_HOSTS: ${ONLINE_PROBE_HOSTS:-}
      REQUEST_RELAY_STATE_DIR: /app/state/relay
      REQUEST_RELAY_BIND: 0.0.0.0
      REQUEST_RELAY_PORT: '8380'
      REQUEST_RELAY_CONSUMER_BIN: /usr/local/bin/cpa-consumer
      REQUEST_RELAY_TIMEOUT: ${REQUEST_RELAY_TIMEOUT:-600}
      REQUEST_RELAY_MAX_RESPONSE_BYTES: ${REQUEST_RELAY_MAX_RESPONSE_BYTES:-67108864}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config.yaml:/app/config.yaml:ro,z
      - cpa2sub2api-state:/app/state
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [sub2api-network, default]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, /app/request_relay.py, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}


# 不覆盖父栈 networks/IPAM，也不重复定义 mihomo 或 sub2api。
volumes:
  cpa2sub2api-out: {}
  cpa2sub2api-state: {}
