name: Docker Build and Push

# 触发分支必须是**仓库实际使用的分支**。
# 本仓库的默认分支是 master（不是 main）。以前两个工作流都只监听 main，
# 于是推送后 CI 一次都不会跑、镜像也永远不会被构建 —— 而部署方式是
# "VPS 拉远程镜像"，这条链路就断在这里，且界面上看不出任何报错，
# 只会表现为"改了代码但 VPS 拉到的还是旧镜像"。
on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: hyskaamorroh
  IMAGE_NAME: cpa2sub2api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          # secret 名统一为 DOCKER_HUB_TOKEN。以前本文件用 DOCKER_HUB_TOKEN、
          # docker-build.yml 用 DOCKER_PASSWORD，两个工作流都会触发，
          # 其中至少一个必然因为读不到对应 secret 而登录失败。
          # 仓库里只需要配置这一个 secret。
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多架构：VPS 可能是 amd64 或 arm64，两种都出。
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Docker Image Build Summary"
            echo ""
            echo "**Image**: \`${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "**Tags**:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Platforms**: linux/amd64, linux/arm64"
            echo ""
            echo "**Pull command**:"
            echo '```bash'
            echo "docker pull ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
